<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#5b21b6"/>
    </linearGradient>
    <linearGradient id="stroke" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#93c5fd"/>
      <stop offset="100%" stop-color="#c4b5fd"/>
    </linearGradient>
  </defs>
  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="88" fill="url(#bg)"/>
  <!-- Sigma (Σ) symbol as clean polyline strokes -->
  <polyline
    points="372,92 130,92 268,256 130,420 372,420"
    fill="none"
    stroke="url(#stroke)"
    stroke-width="40"
    stroke-linejoin="round"
    stroke-linecap="round"/>
  <!-- Small decorative dot (subscript hint) -->
  <circle cx="390" cy="390" r="18" fill="#a78bfa" opacity="0.7"/>
</svg>
